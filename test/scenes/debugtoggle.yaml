type: custom:ha-homelab-map
debug_toggle: true
vlans: {LAN: "#6c9cda", IoT: "#66b771"}
items:
  - type: device
    id: router
    at: [0, 0]
    size: [200, 60]
    items:
      - {type: label, id: router_name, at: [8, 6], text: RB4011iGS+, size: 12, bold: true}
      - {type: led, id: lan, at: [10, 48], size: [18, 3], vlan: LAN}
      - {type: led, id: iot, at: [32, 48], size: [18, 3], vlan: IoT}
      - {type: label, id: legend_lan, at: [10, 38], text: LAN, size: 8, color: secondary}
      - {type: label, id: legend_iot, at: [34, 38], text: IoT, size: 8, color: secondary}
      - {type: label, id: warn, at: [140, 6], text: "warning", color: "#d26066"}
  - type: device
    id: poe
    at: [220, 0]
    size: [10, 60]
    items:
      - {type: label, id: poe_text, at: [1, 6], text: RBGPOE, size: 7, vertical: true}
  - type: endpoint
    id: tv
    at: [250, 14]
    icon: "mdi:cctv"
    items:
      - {type: label, id: tv_caption, at: [0, 34], text: CAM, size: 8, color: secondary}
