type: custom:ha-homelab-map
font: JetBrains Mono
vlans: {LAN: "#6c9cda", IoT: "#66b771", NoT: "#d6995c"}
items:
  - type: rack
    id: rack
    at: [20, 20]
    units: 4
    items:
      - {type: badge, id: rack_temp, at: [22, -8], entity: sensor.rack_temperature, icon: "mdi:thermometer", decimals: 1, size: 10, show_border: true}
      - type: rackdevice
        id: router
        u: 1
        units: 2
        items:
          - {type: chip, id: router_logo, at: [5, 4], image: /local/ha-homelab-map/logos/mikrotik.svg, status_entity: binary_sensor.router_online, update_entity: update.router_firmware}
          - {type: label, id: router_name, at: [26, 6], text: Router, size: 12, bold: true}
          - {type: led, id: router_lan, at: [10, 44], vlan: LAN}
          - {type: led, id: router_iot, at: [16, 44], vlan: IoT}
          - {type: led, id: router_not, at: [22, 44], vlan: NoT}
          - {type: badge, id: router_cpu, at: [220, 23], entity: sensor.router_cpu, icon: "mdi:cpu-64-bit", size: 10}
          - {type: badge, id: router_temp, at: [220, 42], entity: sensor.router_temperature, icon: "mdi:thermometer", decimals: 1, size: 10}
      - type: rackdevice
        id: server
        u: 3
        units: 2
        items:
          - {type: chip, id: server_logo, at: [5, 4], image: /local/ha-homelab-map/logos/debian.svg, status_entity: binary_sensor.server_online}
          - {type: label, id: server_name, at: [26, 6], text: Server, size: 12, bold: true}
          - type: group
            id: containers
            at: [10, 26]
            items:
              - {type: chip, id: c_ha, at: [0, 0], size: 18, image: /local/ha-homelab-map/logos/home-assistant.svg, status_entity: sensor.ha_state}
              - {type: chip, id: c_grafana, at: [24, 0], size: 18, image: /local/ha-homelab-map/logos/grafana.svg, status_entity: sensor.grafana_state, update_entity: binary_sensor.grafana_update}
              - {type: chip, id: c_mqtt, at: [48, 0], size: 18, image: /local/ha-homelab-map/logos/mosquitto.svg, status_entity: sensor.mqtt_state}
              - {type: chip, id: c_redis, at: [72, 0], size: 18, image: /local/ha-homelab-map/logos/redis.svg, status_entity: sensor.redis_state}
          - {type: badge, id: server_cpu, at: [220, 6], entity: sensor.server_cpu, icon: "mdi:cpu-64-bit", size: 10}
          - {type: badge, id: server_containers, at: [220, 42], entity: sensor.server_containers, icon: "mdi:docker", size: 10, toggle: containers}
  - type: device
    id: ap
    at: [440, 20]
    size: [200, 64]
    items:
      - {type: chip, id: ap_logo, at: [5, 4], image: /local/ha-homelab-map/logos/mikrotik.svg, status_entity: binary_sensor.ap_online}
      - {type: label, id: ap_name, at: [26, 6], text: Access point, size: 12, bold: true}
      - {type: led, id: ap_lan, at: [10, 44], vlan: LAN}
      - {type: led, id: ap_iot, at: [16, 44], vlan: IoT}
      - {type: led, id: ap_not, at: [22, 44], vlan: NoT}
      - {type: badge, id: ap_clients, at: [140, 42], entity: sensor.ap_clients, icon: "mdi:account", units: none, size: 10}
  - type: endpoint
    id: tv
    at: [700, 36]
    items:
      - {type: chip, id: tv_logo, at: [4, 4], size: 24, image: /local/ha-homelab-map/logos/android.svg}
datalines:
  - id: router-ap
    start_device: router
    start_edge: right
    end_device: ap
    end_edge: left
    points: [[400, 62], [400, 52]]
    vlans: [LAN, IoT, NoT]
    flow: dominant
    rx: sensor.ap_tx
    tx: sensor.ap_rx
    rates_at: start
    rates_placement: above
  - {id: ap-tv, start_device: ap, start_edge: right, end_device: tv, end_edge: left, vlans: [IoT], flow: forward}
  - id: server-router
    start_device: server
    start_edge: right
    start_point: 30
    end_device: router
    end_edge: right
    end_point: 80
    points: [[380, 113.6], [380, 80.6]]
    vlans: [LAN]
    flow: forward
powerlines:
  - id: ups-ap
    start_device: rack
    start_edge: bottom
    start_point: 90
    end_device: ap
    end_edge: bottom
    points: [[332.3, 180], [540, 180]]
    flow: forward
